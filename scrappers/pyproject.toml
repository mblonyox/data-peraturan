[project]
name = "scrappers"
version = "0.1.0"
description = "Scrappers peraturan perundang-undangan from JDIH Sekretariat Negara"
readme = "README.md"
authors = [
    { name = "Sukirno", email = "mblonyox@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.4.2",
    "easyocr>=1.7.2",
    "ipykernel>=7.1.0",
    "kreuzberg>=4.0.1",
    "marker-pdf>=2.0.0",
    "pymupdf>=1.27.1",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    "typer>=0.21.1",
]

[project.scripts]
setneg = "setneg:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
